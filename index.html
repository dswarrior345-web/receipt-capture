<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b5cad">
<title>Receipt Capture</title>
<script src="config.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#f4f6f9; --card:#fff; --text:#1f2328; --muted:#636c76; --line:#d8dee4;
          --primary:#0b5cad; --ok:#1a7f37; --warn:#9a6700; --err:#cf222e; --wa:#25d366; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d;
            --primary:#4493f8; --ok:#3fb950; --warn:#d29922; --err:#f85149; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--primary); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  header .title { font-size:18px; font-weight:600; flex:1; min-width:0; }
  header .who { font-size:13px; opacity:.9; text-align:right; }
  header button { width:auto; padding:6px 10px; font-size:13px; background:rgba(255,255,255,.18); }
  .lang { display:flex; border:1px solid rgba(255,255,255,.5); border-radius:8px; overflow:hidden; flex:none; }
  .lang button { border-radius:0; background:transparent; padding:5px 9px; font-size:12px; opacity:.75; }
  .lang button.on { background:#fff; color:var(--primary); opacity:1; }
  main { max-width:520px; margin:0 auto; padding:16px; }
  .screen { display:none; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .step { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-weight:600; }
  .num { width:26px; height:26px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-size:13px; flex:none; }
  .done .num { background:var(--ok); color:#fff; }
  label.f { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  input[type=text], input[type=password] { width:100%; padding:12px; font-size:16px; border:1px solid var(--line);
    border-radius:8px; background:var(--bg); color:var(--text); }
  button { display:block; width:100%; padding:13px; font-size:16px; font-weight:600; border:0; border-radius:8px;
           background:var(--primary); color:#fff; cursor:pointer; }
  button.secondary { background:transparent; color:var(--primary); border:1px solid var(--primary); margin-top:8px; }
  button.wa { background:var(--wa); color:#063; margin-top:14px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .muted { color:var(--muted); font-size:13px; }
  .val { word-break:break-all; font-family:ui-monospace,Consolas,monospace; font-size:14px; margin-top:6px; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
  .center { text-align:center; }
  .big { font-size:26px; font-weight:700; margin:8px 0; }
  .icon { font-size:44px; }
  #reader { width:100%; border-radius:8px; overflow:hidden; margin-top:8px; }
  .thumbs { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
  .thumbs:empty { display:none; }
  .thumb { position:relative; aspect-ratio:3/4; border-radius:8px; overflow:hidden; background:var(--line); }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; cursor:zoom-in; }
  .thumb .n { position:absolute; left:4px; top:4px; background:#000a; color:#fff; font-size:11px; padding:1px 6px; border-radius:10px; }
  .thumb .rm { position:absolute; right:4px; top:4px; width:28px; height:28px; padding:0; border-radius:50%;
               background:#000b; color:#fff; font-size:15px; line-height:28px; }
  .plate { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px;
           padding:4px 4px 4px 10px; margin:4px 6px 0 0; background:var(--bg); color:var(--text);
           font-family:ui-monospace,Consolas,monospace; font-weight:700; font-size:14px; }
  .plate button { width:auto; padding:5px 9px; font-size:12px; border-radius:6px; }
  /* offline / upload queue bar */
  #qbar { display:none; background:var(--card); border-bottom:1px solid var(--line); }
  #qbar .in { max-width:520px; margin:0 auto; padding:8px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; font-size:14px; }
  #qbar .st { flex:1; min-width:0; }
  #qbar .st.off { color:var(--warn); font-weight:600; }
  #qbar button { width:auto; padding:7px 12px; font-size:13px; }
  #qbar button.link { background:transparent; color:var(--primary); padding:7px 4px; }
  #qlist { display:none; width:100%; }
  #qlist .item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 10px; padding:8px 0; border-top:1px solid var(--line); }
  #qlist .item .s { font-size:12px; }
  #qlist .item button { padding:5px 9px; font-size:12px; background:transparent; color:var(--err); border:1px solid var(--err); }
  .note { border-radius:8px; padding:10px 12px; margin-top:10px; background:var(--bg); border:1px solid var(--line); font-size:14px; }
  /* full-screen in-app camera */
  #cam { position:fixed; inset:0; background:#000; display:none; flex-direction:column; z-index:10; }
  #cam video { flex:1; width:100%; min-height:0; object-fit:contain; background:#000; }
  #cam .bar { display:flex; gap:12px; padding:16px; justify-content:center; align-items:center; }
  #cam .shutter { width:72px; height:72px; border-radius:50%; border:5px solid #fff; background:#fff3; padding:0; }
  #cam .shutter:disabled { opacity:.35; }
  #cam .cancel { width:auto; background:transparent; border:1px solid #fff8; padding:10px 16px; }
  #cam .hint { color:#fff; text-align:center; font-size:13px; padding:8px; opacity:.8; }
  #cam .count { color:#fff; font-weight:700; font-size:15px; min-width:80px; text-align:center; }
  #cam .flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .15s; }
</style>
</head>
<body>
<header>
  <div class="title" data-i18n="appTitle">Receipt Capture</div>
  <div class="who" id="who"></div>
  <div class="lang" role="group" aria-label="Language / Lugha">
    <button id="langEn" lang="en">EN</button><button id="langSw" lang="sw">SW</button>
  </div>
  <button id="logoutBtn" style="display:none" data-i18n="logout">Logout</button>
</header>
<div id="qbar" role="status" aria-live="polite">
  <div class="in">
    <span class="st" id="qStatus"></span>
    <button class="link" id="qToggle"></button>
    <button id="qSync"></button>
    <div id="qlist"></div>
  </div>
</div>
<main>

  <!-- LOGIN -->
  <section class="screen" id="loginScreen">
    <div class="card">
      <div class="step" data-i18n="signIn">Sign in</div>
      <form id="loginForm" autocomplete="on">
        <label class="f" for="username" data-i18n="username">Username</label>
        <input type="text" id="username" autocomplete="username" autocapitalize="none" required>
        <label class="f" for="password" data-i18n="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit" style="margin-top:14px" id="loginBtn" data-i18n="login">Login</button>
      </form>
      <p class="muted center" id="loginMsg"></p>
    </div>
  </section>

  <!-- LOCATION GATE -->
  <section class="screen" id="gateScreen">
    <div class="card center">
      <div class="icon">&#128205;</div>
      <div class="big" style="font-size:20px" data-i18n="locRequired">Location is required</div>
      <p id="gateMsg" class="muted"></p>
      <div id="gateHelp" class="muted" style="text-align:left;display:none">
        <b data-i18n="howTitle">To turn location on:</b>
        <ol style="padding-left:18px;margin:6px 0">
          <li data-i18n="how1"></li>
          <li data-i18n="how2"></li>
          <li data-i18n="how3"></li>
        </ol>
      </div>
      <button id="gateRetry" style="margin-top:10px" data-i18n="tryAgain">Try again</button>
    </div>
  </section>

  <!-- MAIN FORM -->
  <section class="screen" id="formScreen">
    <div class="card" id="s1">
      <div class="step"><span class="num">1</span><span data-i18n="stepQr">Scan receipt QR code</span></div>
      <button id="scanBtn"></button>
      <div id="reader"></div>
      <div id="qrOut" class="val"></div>
    </div>

    <div class="card" id="s2">
      <div class="step"><span class="num">2</span><span data-i18n="stepPhotos">Take photos</span>
        <span class="muted" style="font-weight:400" data-i18n="oneToSix">(1 to 6)</span></div>
      <button id="photoBtn"></button>
      <div class="thumbs" id="thumbs"></div>
    </div>

    <div class="card" id="sV">
      <div class="step"><span class="num">3</span><span data-i18n="stepVehicle">Vehicle</span></div>
      <label class="f" for="truckNo"><span data-i18n="truckNo">Truck No</span> <span class="err">*</span></label>
      <input type="text" id="truckNo" data-i18n-ph="truckPh" autocomplete="off" autocapitalize="characters" maxlength="20">
      <label class="f" for="trailerNo" data-i18n="trailerNo">Trailer No</label>
      <input type="text" id="trailerNo" data-i18n-ph="trailerPh" autocomplete="off" autocapitalize="characters" maxlength="20">
      <div id="plateBox" class="muted" style="margin-top:10px"></div>
    </div>

    <div class="card" id="s3">
      <div class="step"><span class="num">4</span><span data-i18n="stepLocation">Location</span></div>
      <div id="locOut" class="muted"></div>
    </div>

    <button id="submitBtn" disabled></button>
    <p id="msg" class="muted center"></p>
  </section>

  <!-- RESULT -->
  <section class="screen" id="resultScreen">
    <div class="card center">
      <div class="icon ok" id="resIcon">&#10004;</div>
      <div id="resTitle"></div>
      <div class="big" id="refOut"></div>
      <div id="resNotes" class="muted"></div>
      <button class="wa" id="shareBtn" data-i18n="shareWa">Share on WhatsApp</button>
      <button class="secondary" id="newBtn" data-i18n="newSubmission">New submission</button>
    </div>
  </section>
</main>

<!-- IN-APP CAMERA (no gallery) -->
<div id="cam">
  <video id="camVideo" playsinline autoplay muted></video>
  <div class="flash" id="camFlash"></div>
  <div class="hint" id="camHint"></div>
  <div class="bar">
    <button class="cancel" id="camCancel" data-i18n="done">Done</button>
    <button class="shutter" id="camShutter" data-i18n-aria="takePhoto"></button>
    <span class="count" id="camCount">0 / 6</span>
  </div>
</div>

<script>
// ---------------- languages ----------------
// Photo stamps and the team email stay in English on purpose (records).
const I18N = {

    notConfigured: 'App not configured: set API_URL in config.js',
    outdated: 'The Google backend is an older version. Ask the admin to deploy the latest Code.gs (Manage deployments → Edit → New version).',
    // WhatsApp message
    shTitle: 'Receipt submission', shEmployee: 'Employee', shTruck: 'Truck', shTrailer: 'Trailer',
    shReceipt: 'Receipt', shAt: 'at', shLocation: 'Location', shTime: 'Time', shPhotos: 'Photos', shMap: 'Map',
    // offline
    offlineNow: 'Offline: submissions are saved on this phone', queuedN: '{n} waiting to upload',
    uploadingQ: 'Uploading saved submissions…', uploadNow: 'Upload now', showList: 'Show', hideList: 'Hide',
    qOtherUser: 'Saved by {user}: uploads when {user} logs in', qErr: 'Not accepted: {err}',
    remove: 'Remove', removeConfirm: 'Tap again to remove', qItem: '{time} · Truck {truck}',
    savedOffline: 'Saved on this phone',
    savedOfflineNote: 'It uploads automatically when the internet is back. You can continue working.',
    pendingRef: '(reference after upload)',
    sessionExpiredQueue: 'Your login has expired. Saved on this phone: log in again to upload.',
    uploadedRefs: 'Uploaded: {refs}', needInternetLogin: 'Internet is needed to log in.',
  },
  sw: {
    appTitle: 'Kunasa Risiti', logout: 'Toka', signIn: 'Ingia', username: 'Jina la mtumiaji', password: 'Nenosiri',
    login: 'Ingia', signingIn: 'Inaingia… (inaweza kuchukua hadi sekunde 15)',
    locRequired: 'Mahali (Location) panahitajika', gettingLocation: 'Inatafuta mahali ulipo…',
    howTitle: 'Kuwasha Location:',
    how1: 'Washa <b>Location / GPS</b> kwenye mipangilio ya haraka ya simu yako.',

    how3: 'Gusa <b>Jaribu tena</b> hapa chini.',
    tryAgain: 'Jaribu tena',
    locBlocked: 'Ruhusa ya Location imezuiwa kwa tovuti hii.',
    locNoFix: 'Imeshindwa kupata mahali kwa GPS. Hakikisha Location imewashwa kisha jaribu tena.',
    locUnsupported: 'Kivinjari hiki hakitumii huduma ya mahali.',
    locLost: 'Mahali pamepotea. Washa Location kisha jaribu tena.',
    locNeededToSubmit: 'Mahali panahitajika ili kutuma.',
    stepQr: 'Changanua msimbo wa QR wa risiti', startScanner: 'Anza kuchanganua', scanAgain: 'Changanua tena',
    traOk: 'Risiti ya TRA ✓', code: 'Namba', time: 'Muda', notTra: 'Si kiungo cha uthibitisho cha TRA',
    cameraNA: 'Kamera haipatikani:',
    stepPhotos: 'Piga picha', oneToSix: '(1 hadi 6)', openCamera: 'Fungua kamera',
    addMore: 'Ongeza picha ({n}/{max})', maxPhotos: 'Kiwango cha juu ni picha {max}',
    cameraPerm: 'Ruhusa ya kamera inahitajika ili kupiga picha.', saving: 'Inahifadhi…',
    camHint0: 'Elekeza kamera kwenye risiti kisha gusa kitufe', camHintN: 'Picha ya {n} imepigwa. Piga nyingine au gusa Maliza.',

    truckPh: 'mf. T 123 ABC', trailerPh: 'mf. T 456 DEF (si lazima)',
    platesRead: 'Namba za usajili zilizosomwa kwenye picha:', truck: 'Lori', trailer: 'Tela',

    stepLocation: 'Mahali', waitingGps: 'Inasubiri GPS…', accuracy: 'Usahihi ±{m} m',
    weak: ' — dhaifu, nenda eneo la wazi ikiwezekana', locked: 'Imefungwa wakati wa kupiga picha',
    submit: 'Tuma', submitN: 'Tuma (picha {n})', submitting: 'Inatuma…', uploadingN: 'Inapakia picha {n}…',

    lowAcc: 'Usahihi wa mahali ulikuwa mdogo.', emailed: 'Timu imearifiwa kwa barua pepe.',
    emailFail: 'Imehifadhiwa, lakini barua pepe haikuweza kutumwa. Msimamizi ataiona kwenye jedwali.',

    noServer: 'Imeshindwa kufikia seva. Angalia intaneti yako kisha jaribu tena.',

    outdated: 'Seva ya Google ni toleo la zamani. Mwombe msimamizi aweke Code.gs mpya (Manage deployments → Edit → New version).',

    shReceipt: 'Risiti', shAt: 'saa', shLocation: 'Mahali', shTime: 'Muda', shPhotos: 'Picha', shMap: 'Ramani',
    offlineNow: 'Hakuna mtandao: mawasilisho yanahifadhiwa kwenye simu hii', queuedN: '{n} yanasubiri kupakiwa',
    uploadingQ: 'Inapakia mawasilisho yaliyohifadhiwa…', uploadNow: 'Pakia sasa', showList: 'Onyesha', hideList: 'Ficha',
    qOtherUser: 'Imehifadhiwa na {user}: itapakiwa {user} akiingia', qErr: 'Haikukubaliwa: {err}',
    remove: 'Ondoa', removeConfirm: 'Gusa tena kuondoa', qItem: '{time} · Lori {truck}',
    savedOffline: 'Imehifadhiwa kwenye simu hii',
    savedOfflineNote: 'Itapakiwa yenyewe mtandao ukirudi. Unaweza kuendelea na kazi.',
    pendingRef: '(namba ya kumbukumbu baada ya kupakia)',
    sessionExpiredQueue: 'Muda wa kuingia umeisha. Imehifadhiwa kwenye simu: ingia tena ili kupakia.',
    uploadedRefs: 'Imepakiwa: {refs}', needInternetLogin: 'Mtandao unahitajika ili kuingia.',
  },
};
// Server messages (always English from the backend) -> Swahili
const SERVER_SW = {
  'Invalid username or password': 'Jina la mtumiaji au nenosiri si sahihi',
  'Enter username and password': 'Weka jina la mtumiaji na nenosiri',
  'Too many failed attempts. Try again in 15 minutes.': 'Majaribio mengi yameshindwa. Jaribu tena baada ya dakika 15.',
  'Session expired. Please log in again.': 'Muda wa kuingia umeisha. Tafadhali ingia tena.',
  'Truck No is required': 'Namba ya lori inahitajika',
  'Location is required': 'Mahali panahitajika',
  'Photo is required': 'Picha inahitajika',
  'QR code missing or invalid': 'Msimbo wa QR haupo au si sahihi',
  'Photo too large': 'Picha ni kubwa mno',
  'Maximum 6 photos': 'Kiwango cha juu ni picha 6',
  'Invalid location': 'Mahali si sahihi',
  'Server error, please try again.': 'Hitilafu ya seva, tafadhali jaribu tena.',
};

let lang = 'en';
try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
if (!I18N[lang]) lang = /^sw\b/i.test(navigator.language || '') ? 'sw' : 'en';

function t(key, vars) {
  let s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if (vars) Object.keys(vars).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
  return s;
}
function trServer(msg) { return lang === 'sw' && SERVER_SW[msg] ? SERVER_SW[msg] : msg; }

// ---------------- app ----------------
const $ = id => document.getElementById(id);
const API = (window.APP_CONFIG || {}).API_URL;
const TRA_RE = /^https?:\/\/verify\.tra\.go\.tz\/([A-Za-z0-9]+)_(\d{6})\/?$/;

let session = null;           // {token, user:{username,name,employeeId}, config:{maxAccuracyM,timezone}}
let state = freshState();
let scanner = null, watchId = null, camStream = null;
let gate = { key: 'gettingLocation', error: false };   // so the gate message can be re-translated

const MAX_PHOTOS = 6;
// photos: [{blob, url, pos, takenAt, placeName}]; photoPos/takenAt/placeName mirror the FIRST photo
// and are what gets submitted as the submission's location.
function freshState() { return { qr: null, photos: [], takenAt: null, photoPos: null, placeName: '', result: null, clientId: newId() }; }
function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
}
function store(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function setLang(l) {
  lang = l;
  try { localStorage.setItem('lang', l); } catch (e) {}
  applyLang();
}
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t('appTitle');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });

function apiError(raw, kind) { const e = new Error(trServer(raw)); e.raw = raw; e.kind = kind || 'server'; return e; }
// Errors carry e.kind: 'network' (no/poor connection), 'auth' (login expired) or 'server' (refused).
// opts.quiet: background calls never log the user out.
async function api(action, data, opts) {
  opts = opts || {};
  if (!API || API.indexOf('http') !== 0) throw apiError(t('notConfigured'));
  const req = {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // simple request: no CORS preflight
    body: JSON.stringify(Object.assign({ action, token: session && session.token }, data || {})),
  };
  // Apps Script sometimes drops the first connection after being idle; retry once.
  // Safe for submit too: each submission carries a clientId, so a repeat is never saved twice.
  let r, j;
  for (let i = 1; ; i++) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), opts.timeoutMs || 90000);
      r = await fetch(API, Object.assign({ signal: ctl.signal }, req));
      j = await r.json();
      clearTimeout(timer);
      break;
    } catch (e) {
      if (i >= 2 || !navigator.onLine) throw apiError(t('noServer'), 'network');
      await new Promise(res => setTimeout(res, 1500));
    }
  }
  if (!j.ok) {
    if (j.code === 'AUTH') {
      if (!opts.quiet) logout(trServer(j.error));
      throw apiError(j.error, 'auth');
    }
    throw apiError(j.error || 'Request failed');
  }
  return j;
}

async function finishPhoto(photo, c) {

    name || (navigator.onLine ? 'Location name unavailable' : 'Offline - location name added on upload'),
    `${photo.pos.lat.toFixed(6)}, ${photo.pos.lon.toFixed(6)}  (±${Math.round(photo.pos.acc)} m)`,
    formatTime(photo.takenAt),

  ]);

// ---------------- number plates read from photos ----------------
let platesPending = 0;
async function readPlatesFrom(photo) {
  if (!navigator.onLine) { photo.plates = []; photo.ocrMissed = true; return; }   // Google reads them on upload
  platesPending++; renderPlates();
  try {
    const j = await api('ocr', { photo: await blobToDataUrl(photo.blob) }, { quiet: true, timeoutMs: 30000 });
    photo.plates = j.plates || [];
  } catch (e) {
    photo.plates = [];
    photo.ocrMissed = e.kind !== 'server';
  } finally {
    platesPending--;
  }
  if (!state.photos.includes(photo)) return renderPlates();
  // fill Truck No automatically with the first plate found, if the user has not typed one
  const first = detectedPlates()[0];
  if (first && !$('truckNo').value.trim()) { $('truckNo').value = first; $('truckNo').dataset.auto = '1'; }
  renderPlates(); refresh();
}
function detectedPlates() {
  const all = [];
  state.photos.forEach(p => (p.plates || []).forEach(x => { if (!all.includes(x)) all.push(x); }));
  return all;
}
function renderPlates() {
  const plates = detectedPlates();
  const parts = [];
  if (plates.length) {
    parts.push(t('platesRead') + '<br>' + plates.map(p =>
      `<span class="plate">${esc(p)}<button data-plate="${esc(p)}" data-to="truckNo">${t('truck')}</button><button data-plate="${esc(p)}" data-to="trailerNo">${t('trailer')}</button></span>`).join(''));
    if ($('truckNo').dataset.auto) parts.push(`<span class="warn">${t('truckAuto')}</span>`);
  }
  if (platesPending) parts.push(t('readingPlates'));

}
$('plateBox').onclick = e => {

['truckNo', 'trailerNo'].forEach(id => $(id).addEventListener('input', () => {
  $(id).value = $(id).value.toUpperCase();
  if (id === 'truckNo') delete $('truckNo').dataset.auto;
  renderPlates(); refresh();
}));
// One lookup per spot: shots within ~30 m reuse the same (possibly still running) lookup.
let placeCache = null;
function placeNameNear(pos) {
  const near = placeCache && Math.abs(placeCache.lat - pos.lat) * 111000 < 30
    && Math.abs(placeCache.lon - pos.lon) * 111000 * Math.cos(pos.lat * Math.PI / 180) < 30;
  if (!near) {
    const entry = { lat: pos.lat, lon: pos.lon, name: placeName(pos.lat, pos.lon) };
    entry.name.then(n => { if (!n && placeCache === entry) placeCache = null; });   // retry next shot
    placeCache = entry;
  }
  return placeCache.name;
}
function syncPhotos() {
  const first = state.photos[0];
  state.photoPos = first ? first.pos : null;
  state.takenAt = first ? first.takenAt : null;
  state.placeName = first ? first.placeName : '';
  const n = state.photos.length;
  $('thumbs').innerHTML = state.photos.map((p, i) => `
    <div class="thumb">${p.url ? `<img src="${p.url}" alt="${t('photoN', { n: i + 1 })}" data-i="${i}">`
      : `<div class="muted" style="display:grid;place-items:center;height:100%">${t('saving')}</div>`}
      <span class="n">${i + 1}</span><button class="rm" data-rm="${i}" aria-label="${t('removePhotoN', { n: i + 1 })}">✕</button></div>`).join('');
  $('photoBtn').textContent = n === 0 ? t('openCamera')
    : n >= MAX_PHOTOS ? t('maxPhotos', { max: MAX_PHOTOS }) : t('addMore', { n, max: MAX_PHOTOS });
  $('photoBtn').disabled = n >= MAX_PHOTOS;
  showLoc(); refresh();
}
$('thumbs').onclick = e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const [gone] = state.photos.splice(Number(rm.dataset.rm), 1);
    if (gone.url) URL.revokeObjectURL(gone.url);
    renderPlates();
    return syncPhotos();
  }
  const img = e.target.closest('img[data-i]');
  if (img) window.open(img.src, '_blank');
};
async function placeName(lat, lon) {
  if (!navigator.onLine) return '';   // offline: Google adds the name when the submission uploads
  try { return (await api('geocode', { lat, lon }, { quiet: true, timeoutMs: 8000 })).name || ''; } catch (e) { return ''; }
}
function formatTime(d, locale) {
  const opts = { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
                 second: '2-digit', hour12: false, timeZoneName: 'short' };
  const loc = locale || 'en-GB';
  try { return new Intl.DateTimeFormat(loc, { ...opts, timeZone: session.config.timezone }).format(d); }
  catch (e) { return new Intl.DateTimeFormat(loc, opts).format(d); }
}
function drawStamp(ctx, w, h, lines) {
  const fs = Math.max(14, Math.round(Math.min(w, h) * 0.04));
  const pad = Math.round(fs * 0.7), lh = Math.round(fs * 1.35);
  ctx.font = `600 ${fs}px system-ui, -apple-system, Segoe UI, Roboto, sans-serif`;
  const rows = [];
  for (const line of lines) {
    let cur = '';
    for (const word of line.split(' ')) {
      const test = cur ? cur + ' ' + word : word;
      if (cur && ctx.measureText(test).width > w - pad * 2) { rows.push(cur); cur = word; }
      else cur = test;
    }
    rows.push(cur);
  }
  const bh = rows.length * lh + pad * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, h - bh, w, bh);
  ctx.fillStyle = '#ffffff';
  ctx.textBaseline = 'top';
  ctx.shadowColor = 'rgba(0,0,0,0.8)'; ctx.shadowBlur = 2;
  rows.forEach((r, i) => ctx.fillText(r, pad, h - bh + pad + i * lh + (lh - fs) / 2));
  ctx.shadowBlur = 0;
}

function refresh() {

function blobToDataUrl(b) {

// ---------------- offline queue (IndexedDB on this phone) ----------------
// Each item: {id: clientId, createdAt, user, payload, photos: [Blob], status: 'waiting'|'error', error}
const DB_NAME = 'receipt-capture', STORE = 'queue';
let dbPromise = null;
function idb() {
  if (!dbPromise) dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => { dbPromise = null; rej(r.error); };
  });
  return dbPromise;
}
async function qTx(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, mode);
    const out = fn(tx.objectStore(STORE));
    tx.oncomplete = () => res(out ? out.result : undefined);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
function qAll() { return qTx('readonly', st => st.getAll()).then(a => (a || []).sort((x, y) => (x.createdAt < y.createdAt ? -1 : 1))); }
function qPut(item) { return qTx('readwrite', st => st.put(item)); }
function qDel(id) { return qTx('readwrite', st => st.delete(id)); }

async function queueAdd(payload) {
  await qPut({
    id: payload.clientId, createdAt: new Date().toISOString(),
    user: { username: session.user.username, name: session.user.name, employeeId: session.user.employeeId },
    payload: Object.assign({}, payload, { offline: true }),
    photos: state.photos.map(ph => ph.blob), status: 'waiting', error: '',
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
}

let syncing = false, authExpired = false, qNotice = '', qOpen = false, qArm = null;
async function syncQueue(manual) {
  if (syncing || !session || !navigator.onLine) return renderQueue();
  syncing = true; qNotice = ''; renderQueue();
  const done = [];
  try {
    for (const item of await qAll()) {
      if (item.user.username !== session.user.username) continue;   // waits for its own user
      if (item.status === 'error' && !manual) continue;              // refused before: retry only on request
      try {
        const photos = await Promise.all(item.photos.map(blobToDataUrl));
        const j = await api('submit', Object.assign({}, item.payload, { photos }), { quiet: true, timeoutMs: 180000 });
        await qDel(item.id);
        done.push(j.ref);
        authExpired = false;
        if (state.result && state.result.queued && state.clientId === item.id) { state.result = j; renderResult(); }
      } catch (err) {
        if (err.kind === 'network') break;                        // still no usable connection
        if (err.kind === 'auth') { authExpired = true; break; }   // needs a fresh login
        item.status = 'error'; item.error = err.message;
        await qPut(item);
      }
      renderQueue();
    }
  } catch (e) {
    /* storage unavailable */
  } finally {
    syncing = false;
    if (done.length) qNotice = t('uploadedRefs', { refs: done.join(', ') });
    renderQueue();
  }
}

let qRenderSeq = 0;
async function renderQueue() {
  const seq = ++qRenderSeq;
  let items = [];
  try { items = await qAll(); } catch (e) { /* no storage */ }
  if (seq !== qRenderSeq) return;   // a newer refresh started meanwhile; let it draw
  const online = navigator.onLine;
  const mine = session ? items.filter(i => i.user.username === session.user.username) : [];
  const visible = !online || items.length > 0 || !!qNotice;
  $('qbar').style.display = visible ? 'block' : 'none';
  if (!visible) return;

  let status;
  if (syncing) status = esc(t('uploadingQ'));
  else if (!online) status = esc(t('offlineNow')) + (items.length ? ' · ' + esc(t('queuedN', { n: items.length })) : '');
  else if (authExpired && mine.length) status = esc(t('sessionExpiredQueue'));
  else if (items.length) status = esc(t('queuedN', { n: items.length }));
  else status = `<span class="ok">${esc(qNotice)}</span>`;
  $('qStatus').innerHTML = status;
  $('qStatus').className = 'st' + (!online ? ' off' : '');

  const canAct = online && !syncing && !!session && mine.length > 0;
  $('qSync').style.display = canAct ? 'block' : 'none';
  $('qSync').textContent = authExpired ? t('login') : t('uploadNow');
  $('qToggle').style.display = items.length ? 'block' : 'none';
  $('qToggle').textContent = qOpen ? t('hideList') : t('showList');

  $('qlist').style.display = qOpen && items.length ? 'block' : 'none';
  $('qlist').innerHTML = items.map(i => {
    const when = formatTime(new Date(i.createdAt), lang === 'sw' ? 'sw-TZ' : 'en-GB');
    const other = !session || i.user.username !== session.user.username;
    const note = other ? `<span class="muted">${esc(t('qOtherUser', { user: i.user.name || i.user.username }))}</span>`
      : i.status === 'error' ? `<span class="err">${esc(t('qErr', { err: i.error }))}</span>` : '';
    const rm = i.status === 'error' && !other
      ? `<button data-qrm="${esc(i.id)}">${esc(qArm === i.id ? t('removeConfirm') : t('remove'))}</button>` : '<span></span>';
    return `<div class="item"><div>${esc(t('qItem', { time: when, truck: i.payload.truckNo }))}<div class="s">${note}</div></div>${rm}</div>`;
  }).join('');
}
$('qlist').onclick = async e => {
  const b = e.target.closest('[data-qrm]');
  if (!b) return;
  if (qArm !== b.dataset.qrm) { qArm = b.dataset.qrm; return renderQueue(); }   // second tap confirms
  qArm = null;
  try { await qDel(b.dataset.qrm); } catch (err) { /* ignore */ }
  renderQueue();
};
$('qSync').onclick = () => (authExpired ? logout() : syncQueue(true));
$('qToggle').onclick = () => { qOpen = !qOpen; renderQueue(); };
window.addEventListener('online', () => { renderQueue(); syncQueue(); });
window.addEventListener('offline', () => renderQueue());
setInterval(() => {   // keep trying while the app is open
  if (navigator.onLine && !syncing && session) qAll().then(a => { if (a.length) syncQueue(); }).catch(() => {});
}, 60000);

// ---------------- WhatsApp share (in the selected language) ----------------
function shareText() {
  const p = state.photoPos, r = state.result, m = (state.qr || '').match(TRA_RE);
  const truck = $('truckNo').value.trim(), trailer = $('trailerNo').value.trim();
  return [
    `*${t('shTitle')} ${r.ref || t('pendingRef')}*`,
    `${t('shEmployee')}: ${session.user.name} (${session.user.employeeId})`,
    `${t('shTruck')}: ${truck}${trailer ? `  |  ${t('shTrailer')}: ${trailer}` : ''}`,
    m ? `${t('shReceipt')}: ${m[1].toUpperCase()} ${t('shAt')} ${m[2].replace(/(\d\d)(\d\d)(\d\d)/, '$1:$2:$3')}` : `QR: ${state.qr}`,
    `${t('shLocation')}: ${state.placeName || '-'}`,
    `${t('shTime')}: ${formatTime(state.takenAt, lang === 'sw' ? 'sw-TZ' : 'en-GB')}`,
    `${t('shPhotos')}: ${state.photos.length}`,
    `${t('shMap')}: https://www.google.com/maps?q=${p.lat.toFixed(6)},${p.lon.toFixed(6)}`,
  ].join('\n');
}
$('shareBtn').onclick = async () => {
  const text = shareText();
  const name = state.result.ref || 'receipt';
  const files = state.photos.map((p, i) =>
    new File([p.blob], `${name}_${i + 1}.jpg`, { type: 'image/jpeg' }));
  if (navigator.canShare && navigator.canShare({ files })) {
    try { await navigator.share({ files, text, title: name }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  // fallback (desktop / older phones): text only via WhatsApp link
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
};

// ---------------- new submission / startup ----------------
function resetForm() {
  $('qrOut').innerHTML = '';
  $('msg').textContent = '';
  $('truckNo').value = ''; $('trailerNo').value = ''; delete $('truckNo').dataset.auto;
  renderQr(); syncPhotos(); renderPlates();
}
function stopAll() {
  stopCamera(); stopScanner();
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
}
$('newBtn').onclick = () => {
  state.photos.forEach(p => { if (p.url) URL.revokeObjectURL(p.url); });
  state = freshState(); resetForm();
  if (lastPos && watchId !== null) show('formScreen'); else startLocationGate();
};

// the app opens without internet after the first visit
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

applyLang();
session = load('session');
if (session && session.token) { startLocationGate(); syncQueue(); } else { session = null; show('loginScreen'); renderQueue(); }
</script>
</body>
</html>
